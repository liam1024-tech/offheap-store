name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java & Maven Settings for GitHub Packages
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Deploy Package to GitHub Packages Registry
      run: mvn -B deploy -DskipTests -s ${{ github.workspace }}/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
